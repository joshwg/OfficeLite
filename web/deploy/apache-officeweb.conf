# Apache virtual hosts for OfficeLite on the web.
#
# office.joshco.com serves everything; word.joshco.com and
# excel.joshco.com only redirect to its /word and /excel pages, so the
# session cookie, the login and (later) the storage quota live on one
# host. Needs: a2enmod ssl proxy proxy_http headers rewrite
# Certificates: certbot --apache -d office.joshco.com -d word.joshco.com -d excel.joshco.com

<VirtualHost *:80>
    ServerName office.joshco.com
    ServerAlias word.joshco.com excel.joshco.com
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^word\.  [NC]
    RewriteRule ^ https://office.joshco.com/word [R=301,L]
    RewriteCond %{HTTP_HOST} ^excel\. [NC]
    RewriteRule ^ https://office.joshco.com/excel [R=301,L]
    RewriteRule ^ https://office.joshco.com%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName word.joshco.com
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/office.joshco.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/office.joshco.com/privkey.pem
    # RedirectMatch, not Redirect: Redirect would keep the path (/x → /wordx).
    RedirectMatch permanent ^ https://office.joshco.com/word
</VirtualHost>

<VirtualHost *:443>
    ServerName excel.joshco.com
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/office.joshco.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/office.joshco.com/privkey.pem
    RedirectMatch permanent ^ https://office.joshco.com/excel
</VirtualHost>

<VirtualHost *:443>
    ServerName office.joshco.com
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/office.joshco.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/office.joshco.com/privkey.pem

    # officeweb sets the other security headers itself.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # officeweb believes X-Forwarded-For only from loopback, and only the
    # last entry, which is the one Apache adds.
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:7100/
    ProxyPassReverse / http://127.0.0.1:7100/
    # The client is tens of megabytes: allow slow downloads.
    ProxyTimeout 600

    # Don't compress again: officeweb sends precompressed .br/.gz copies.
    SetEnv no-gzip 1

    ErrorLog  ${APACHE_LOG_DIR}/officeweb_error.log
    CustomLog ${APACHE_LOG_DIR}/officeweb_access.log combined
</VirtualHost>
