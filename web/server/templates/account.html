{{define "content"}}
<h1>Account</h1>
<section class="card">
  <p><strong>{{.User.Username}}</strong>{{if .User.IsAdmin}} · administrator{{end}}</p>
  <p class="hint">Server storage: {{bytes .User.QuotaBytes}} (coming in a later release).</p>
</section>
<section class="card narrow">
  <h2>Change password</h2>
  <form method="post" action="/account/password">
    <label>Current password <input name="current" type="password" autocomplete="current-password" required></label>
    <label>New password <input name="new" type="password" autocomplete="new-password" required></label>
    <label>Repeat new password <input name="confirm" type="password" autocomplete="new-password" required></label>
    <button>Change password</button>
  </form>
  <p class="hint">Changing it logs you out everywhere else.</p>
</section>
{{end}}
