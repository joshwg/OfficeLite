{{define "app"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · OfficeLite</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="app-page">
<div id="status" class="status">Loading {{.Title}}…</div>
<script src="/static/idle.js" data-idle="{{idleSeconds}}" data-warn="{{warnSeconds}}" data-ping="{{pingSeconds}}"></script>
<!-- serverfs.js before wasm_exec.js: its file system replaces the stub. -->
<script src="/static/serverfs.js" data-max-name="{{maxFileName}}" data-exts="{{storableExts}}"></script>
<script src="/client/wasm_exec.js"></script>
<script src="/static/app.js" data-app="{{.Data.App}}"></script>
</body>
</html>{{end}}
